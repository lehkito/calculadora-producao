<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora | Produção, material e margem</title><style>/* =====================================================================
   Calculadora — Soft Modern Dark
   Design system: refined dark, soft borders, generous radii, calm motion
   ===================================================================== */

:root {
  /* Backgrounds — warm-tinted dark */
  --bg:            #0c0d10;
  --bg-canvas:     #0f1115;
  --surface:       #15171c;
  --surface-2:     #1a1d23;
  --surface-3:     #1f232a;
  --surface-hover: #232830;
  --surface-input: #181b21;

  /* Borders */
  --border:        #23262e;
  --border-soft:   #1c1f25;
  --border-strong: #2d3139;

  /* Text */
  --text:          #e9ebef;
  --text-2:        #b6bac3;
  --text-3:        #7a808c;
  --text-4:        #545864;

  /* Accent (default — overridden by tweak) */
  --accent:        #e3b878;
  --accent-soft:   rgba(227, 184, 120, 0.10);
  --accent-strong: #f0c890;
  --on-accent:     #15110a;

  /* Semantic */
  --positive:      #6ee7b7;
  --positive-soft: rgba(110, 231, 183, 0.10);
  --negative:      #fda4af;
  --negative-soft: rgba(253, 164, 175, 0.10);
  --info:          #93c5fd;
  --info-soft:     rgba(147, 197, 253, 0.10);

  /* Shape */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Shadow */
  --sh-1: 0 1px 0 rgba(255,255,255,0.02) inset, 0 1px 2px rgba(0,0,0,0.3);
  --sh-2: 0 4px 16px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.02) inset;
  --sh-3: 0 16px 40px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.03) inset;
  --sh-focus: 0 0 0 3px rgba(227, 184, 120, 0.18);

  /* Type */
  --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;

  /* Layout */
  --sidebar-w: 232px;
  --rail-w: 340px;
  --topbar-h: 56px;

  /* Density */
  --pad: 14px;
  --gap: 14px;
}

[data-density="compact"] { --pad: 10px; --gap: 10px; }
[data-density="cozy"]    { --pad: 18px; --gap: 18px; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
}

.mono, input.mono, .num {
  font-family: var(--font-mono);
  font-feature-settings: 'tnum' 1, 'zero' 1, 'ss01' 1;
  letter-spacing: -0.01em;
}

/* ============== APP SHELL ============== */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--rail-w);
  min-height: 100vh;
}

@media (max-width: 1280px) {
  .app { grid-template-columns: var(--sidebar-w) 1fr; }
  .rail { display: none; }
}

@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* ============== SIDEBAR ============== */
.sidebar {
  background: var(--bg-canvas);
  border-right: 1px solid var(--border-soft);
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px 18px;
  margin-bottom: 4px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  display: grid; place-items: center;
  color: var(--on-accent);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.04em;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset;
}
.brand-name {
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.015em;
  color: var(--text);
}
.brand-sub {
  font-size: 10.5px;
  color: var(--text-4);
  margin-top: 1px;
  letter-spacing: 0;
}

.nav-section {
  padding: 14px 10px 6px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: background 120ms, color 120ms;
  user-select: none;
  border: 1px solid transparent;
}
.nav-item:hover {
  background: var(--surface);
  color: var(--text);
}
.nav-item.active {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}
.nav-item .ico {
  width: 14px; height: 14px;
  color: var(--text-3);
  flex-shrink: 0;
}
.nav-item.active .ico { color: var(--accent); }
.nav-item .badge {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-4);
  font-family: var(--font-mono);
  background: var(--surface);
  padding: 1px 6px;
  border-radius: 4px;
}
.nav-item.active .badge { background: var(--surface-3); color: var(--text-3); }

.nav-product-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  color: var(--text-2);
  cursor: pointer;
  transition: background 120ms;
}
.nav-product-row:hover { background: var(--surface); color: var(--text); }
.nav-product-row.active {
  background: var(--surface-2);
  color: var(--text);
}
.nav-product-row .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-4);
  flex-shrink: 0;
}
.nav-product-row.active .dot { background: var(--accent); }
.nav-product-row .name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nav-product-row .close {
  width: 16px; height: 16px;
  border-radius: 4px;
  display: none;
  place-items: center;
  color: var(--text-4);
  font-size: 14px;
  line-height: 1;
}
.nav-product-row:hover .close { display: grid; }
.nav-product-row .close:hover { background: var(--surface-3); color: var(--negative); }

.nav-add {
  padding: 7px 10px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  color: var(--text-3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px dashed var(--border);
  background: transparent;
  margin: 4px 0;
  width: 100%;
  font-family: inherit;
  white-space: nowrap;
}
.nav-add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.sidebar-footer {
  margin-top: auto;
  padding: 8px 10px;
  border-top: 1px solid var(--border-soft);
  font-size: 11px;
  color: var(--text-4);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-footer .avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface-3);
  display: grid; place-items: center;
  color: var(--text-2);
  font-size: 11px; font-weight: 600;
}

/* ============== MAIN ============== */
.main-wrap {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.topbar {
  height: var(--topbar-h);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-soft);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(20px);
}
.topbar-title {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.topbar-eyebrow {
  font-size: 10.5px;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
}
.topbar-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.main {
  flex: 1;
  padding: 24px 28px 60px;
  width: 100%;
  max-width: 920px;
}

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  font-size: 12.5px;
  font-family: inherit;
  font-weight: 500;
  border-radius: var(--r-sm);
  cursor: pointer;
  letter-spacing: -0.005em;
  transition: background 120ms, border-color 120ms, color 120ms;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-2);
}
.btn-ghost:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-primary {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
  font-weight: 600;
}
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-positive {
  background: transparent;
  border-color: var(--positive);
  color: var(--positive);
  font-weight: 600;
}
.btn-positive:hover { background: var(--positive-soft); }
.btn-danger:hover { color: var(--negative); border-color: var(--negative); }
.btn-sm { padding: 4px 9px; font-size: 11.5px; }
.btn-lg { padding: 9px 18px; font-size: 13px; }

.btn .ico { width: 13px; height: 13px; }

/* ============== CARD ============== */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: var(--sh-1);
}
.card-head {
  padding: 14px 18px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--border-soft);
}
.card-head .h-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.card-head .h-num {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-4);
  font-weight: 500;
  letter-spacing: 0.04em;
}
.card-head .h-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.card-head .h-sub {
  font-size: 11.5px;
  color: var(--text-3);
  margin-left: auto;
}
.card-body { padding: 18px; }
.card-body.flush { padding: 0; }

/* ============== FORM ============== */
.grid { display: grid; gap: var(--gap); }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
/* Tighter grid responsive breakpoints */
@media (max-width: 1180px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.field { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-size: 11.5px;
  color: var(--text-3);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.field-hint { font-size: 10.5px; color: var(--text-4); margin-top: 2px; }
.field-hint.warn { color: var(--negative); }

input[type="text"],
input[type="number"],
input[type="email"],
input[type="password"],
select, textarea {
  background: var(--surface-input);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 11px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 13px;
  width: 100%;
  transition: border-color 120ms, background 120ms, box-shadow 120ms;
}
select, input[type="text"]:not(.mono),
input[type="email"], input[type="password"] {
  font-family: var(--font-sans);
}
textarea {
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.5;
  min-height: 100px;
  resize: vertical;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: var(--sh-focus);
  background: var(--surface-2);
}
input.input-warn {
  border-color: var(--negative);
  background: var(--negative-soft);
}
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}

.computed {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  color: var(--text);
  padding: 8px 11px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: right;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
.computed.accent { color: var(--accent); border-color: rgba(227, 184, 120, 0.25); }
.computed.positive { color: var(--positive); border-color: rgba(110, 231, 183, 0.22); }
.computed.negative { color: var(--negative); border-color: rgba(253, 164, 175, 0.22); }
.computed.info { color: var(--info); border-color: rgba(147, 197, 253, 0.22); }

/* ============== SEGMENTED ============== */
.segmented {
  display: inline-flex;
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 2px;
  gap: 2px;
}
.segmented.full { display: flex; }
.seg-btn {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-3);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 120ms, color 120ms;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active {
  background: var(--surface-3);
  color: var(--text);
  box-shadow: var(--sh-1);
}

/* ============== TIP ============== */
.tip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-3);
  color: var(--text-3);
  font-size: 9px;
  font-weight: 600;
  cursor: help;
  border: 1px solid var(--border);
  user-select: none;
  font-family: var(--font-sans);
}
.tip:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ============== TABLE / DRE ============== */
.dre {
  font-family: var(--font-sans);
}
.dre-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 24px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border-soft);
  align-items: center;
  font-size: 13px;
}
.dre-row.head {
  padding: 11px 18px;
  background: var(--surface-2);
  color: var(--text-4);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-soft);
}
.dre-row.subtotal {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--text);
}
.dre-row.final {
  background: var(--accent-soft);
  font-weight: 700;
  color: var(--accent);
  border-top: 1px solid rgba(227, 184, 120, 0.3);
  border-bottom: none;
}
.dre-row .label { display: flex; align-items: center; gap: 8px; }
.dre-row .value,
.dre-row .pct,
.dre-row .unit {
  font-family: var(--font-mono);
  font-size: 12.5px;
  text-align: right;
}
.dre-row .pct, .dre-row .unit { color: var(--text-3); font-size: 11.5px; min-width: 64px; }
.dre-row.final .value { font-size: 14.5px; }
.dre-row.final .pct, .dre-row.final .unit { color: var(--accent); opacity: 0.8; }
.dre-row .neg { color: var(--negative); }

/* ============== KPI RAIL ============== */
.rail {
  border-left: 1px solid var(--border-soft);
  background: var(--bg-canvas);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 18px 18px 60px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.rail-section-label {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding: 0 2px;
}

.kpi-hero {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.kpi-hero::after {
  content: '';
  position: absolute;
  top: -40%; right: -20%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  pointer-events: none;
}
.kpi-hero .label {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.kpi-hero .value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--accent);
  line-height: 1.1;
}
.kpi-hero .value.neg { color: var(--negative); }
.kpi-hero .sub {
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--text-3);
  font-family: var(--font-mono);
}
.kpi-hero .sub .pos { color: var(--positive); }
.kpi-hero .sub .neg { color: var(--negative); }

.kpi-mini {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.kpi-mini-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 11px 13px;
}
.kpi-mini-card .label {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.kpi-mini-card .value {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.kpi-mini-card .value.pos { color: var(--positive); }
.kpi-mini-card .value.neg { color: var(--negative); }
.kpi-mini-card .value.info { color: var(--info); }
.kpi-mini-card .sub {
  font-size: 10.5px;
  color: var(--text-4);
  margin-top: 2px;
  font-family: var(--font-mono);
}

/* Distribution bar (carga tributária visual) */
.dist-bar {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 13px 15px;
}
.dist-bar .label {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}
.dist-bar .track {
  height: 6px;
  border-radius: 100px;
  background: var(--surface-3);
  overflow: hidden;
  display: flex;
}
.dist-bar .track .seg {
  height: 100%;
  transition: width 300ms;
}
.dist-bar .legend {
  margin-top: 10px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 10px;
  font-size: 10.5px;
  color: var(--text-3);
}
.dist-bar .legend .row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
}
.dist-bar .legend .swatch {
  width: 7px; height: 7px;
  border-radius: 2px;
}

/* ============== INSUMOS ============== */
.insumos {
  background: var(--surface);
}
.insumos-head {
  display: grid;
  grid-template-columns: 1.7fr 0.9fr 0.9fr 0.9fr 0.9fr 1.3fr;
  gap: 10px;
  padding: 11px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border-soft);
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.insumo {
  display: grid;
  grid-template-columns: 1.7fr 0.9fr 0.9fr 0.9fr 0.9fr 1.3fr;
  gap: 10px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border-soft);
  align-items: center;
  transition: background 120ms;
}
.insumo:hover { background: var(--surface-2); }
.insumo.custom { border-left: 2px solid var(--accent); padding-left: 16px; }
.insumo input {
  padding: 5px 9px;
  font-size: 12px;
}
.insumo .nome {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
}
.insumo .nota {
  font-size: 11px;
  color: var(--text-4);
}
.insumo .nome-input {
  background: transparent;
  border: 1px solid transparent;
  padding: 5px 8px;
  font-size: 12.5px;
  font-family: var(--font-sans);
  color: var(--text);
  border-radius: 4px;
}
.insumo .nome-input:hover { border-color: var(--border); }
.insumo .nome-input:focus {
  background: var(--surface-input);
  border-color: var(--accent);
}
.insumo .nota-input {
  background: transparent;
  border: 1px solid transparent;
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--font-sans);
  color: var(--text-3);
  flex: 1;
  min-width: 0;
}
.insumo .nota-input:hover { border-color: var(--border-soft); }
.insumo .nota-input:focus {
  background: var(--surface-input);
  border-color: var(--accent);
  color: var(--text);
}
.insumo-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.icon-btn {
  width: 22px; height: 22px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-4);
  font-size: 14px;
  line-height: 1;
  border-radius: 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { color: var(--negative); border-color: var(--border); background: var(--surface-input); }

.insumo-add-bar {
  padding: 10px 18px;
  border-bottom: 1px solid var(--border-soft);
}
.insumo-subtotal {
  display: grid;
  grid-template-columns: 1.7fr 0.9fr 0.9fr 0.9fr 0.9fr 1.3fr;
  gap: 10px;
  padding: 12px 18px;
  background: var(--surface-2);
  font-weight: 600;
  font-size: 12.5px;
}
.insumo-subtotal .label { color: var(--text); }
.insumo-subtotal .value {
  font-family: var(--font-mono);
  color: var(--accent);
}

/* ============== HISTORIA ============== */
.hist-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 12px;
}
.hist-toolbar h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.hist-toolbar .meta {
  font-size: 11.5px;
  color: var(--text-4);
  font-family: var(--font-mono);
}
.hist-empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-3);
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--r-lg);
}
.hist-empty .big {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: 0.5;
}
.hist-table {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.hist-row {
  display: grid;
  grid-template-columns: 70px 1fr 110px 80px 100px 80px 100px 100px;
  gap: 14px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border-soft);
  align-items: center;
  cursor: pointer;
  transition: background 120ms;
  font-size: 12.5px;
}
.hist-row:last-child { border-bottom: none; }
.hist-row:hover { background: var(--surface-2); }
.hist-row.head {
  background: var(--surface-2);
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: default;
}
.hist-row.head:hover { background: var(--surface-2); }
.hist-row .seq {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-3);
  color: var(--accent);
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-block;
  border: 1px solid rgba(227, 184, 120, 0.18);
}
.hist-row .num {
  font-family: var(--font-mono);
  text-align: right;
}
.hist-row .actions {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}
.hist-row .actions button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-3);
  padding: 3px 8px;
  font-size: 10.5px;
  font-family: inherit;
  border-radius: 4px;
  cursor: pointer;
}
.hist-row .actions button:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-input); }
.hist-row .actions button.del:hover { color: var(--negative); border-color: var(--negative); }

/* ============== UFs ============== */
.uf-grid {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.uf-row {
  display: grid;
  grid-template-columns: 80px 1fr 1fr 1fr 1fr;
  gap: 14px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 13px;
  align-items: center;
}
.uf-row:last-child { border-bottom: none; }
.uf-row.head {
  background: var(--surface-2);
  font-size: 10.5px;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
}
.uf-row .uf {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
}
.uf-row .v {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-2);
}

/* ============== BANNERS / HINTS ============== */
.banner {
  border-radius: var(--r-md);
  padding: 12px 16px;
  font-size: 12.5px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 16px;
  line-height: 1.45;
}
.banner-warn {
  background: var(--negative-soft);
  border: 1px solid rgba(253, 164, 175, 0.25);
  color: var(--negative);
}
.banner-info {
  background: var(--info-soft);
  border: 1px solid rgba(147, 197, 253, 0.22);
  color: var(--info);
}
.banner-accent {
  background: var(--accent-soft);
  border: 1px solid rgba(227, 184, 120, 0.25);
  color: var(--accent);
}
.banner strong { font-weight: 600; }
.banner .ico {
  flex-shrink: 0;
  margin-top: 1px;
}

/* ============== SAVE BAR ============== */
.save-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-lg);
  margin-top: 16px;
}
.save-bar .hint {
  font-size: 11.5px;
  color: var(--text-4);
}

/* ============== PILLS ============== */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 10.5px;
  font-family: var(--font-mono);
  color: var(--text-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-weight: 500;
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(227, 184, 120, 0.22); }
.pill.positive { background: var(--positive-soft); color: var(--positive); border-color: rgba(110, 231, 183, 0.22); }
.pill.negative { background: var(--negative-soft); color: var(--negative); border-color: rgba(253, 164, 175, 0.22); }

/* ============== TOAST ============== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 12px);
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  padding: 10px 18px;
  border-radius: var(--r-md);
  font-size: 12.5px;
  z-index: 200;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  box-shadow: var(--sh-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { border-color: var(--negative); color: var(--negative); }
.toast.ok { border-color: var(--positive); color: var(--positive); }

/* ============== PRODUCT NAME INPUT ============== */
.product-name {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 4px 0;
  margin-bottom: 4px;
  font-family: var(--font-sans);
  width: 100%;
}
.product-name:focus {
  outline: none;
  box-shadow: 0 1px 0 var(--accent);
}
.product-meta {
  font-size: 11.5px;
  color: var(--text-4);
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ============== DIVIDER ============== */
.subhead {
  margin-top: 22px;
  margin-bottom: 12px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-4);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ============== SCROLLBAR ============== */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--surface-3);
  border-radius: 100px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* ============== ICONS ============== */
.ico {
  display: inline-block;
  vertical-align: middle;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ============== SUPABASE: LOGIN ============== */
.login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--sh-3);
  overflow: hidden;
}
.login-head {
  padding: 24px 24px 8px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.login-brand-mark {
  width: 40px; height: 40px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
  letter-spacing: -0.01em;
}
.login-title {
  font-size: 15px; font-weight: 700;
  color: var(--text-1); letter-spacing: -0.01em;
}
.login-sub {
  font-size: 11.5px; color: var(--text-3);
  margin-top: 2px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.login-body {
  padding: 8px 24px 16px;
}
.login-body .field { margin-bottom: 14px; }
.login-error {
  color: var(--negative);
  font-size: 12px;
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(248, 113, 113, 0.08);
  border-radius: 6px;
  border-left: 2px solid var(--negative);
}
.login-foot {
  padding: 16px 24px 24px;
  border-top: 1px solid var(--border-soft);
}

/* ============== LOADING OVERLAY ============== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 8, 12, 0.55);
  backdrop-filter: blur(3px);
  z-index: 9500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--surface-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-text {
  font-size: 12.5px;
  color: var(--text-2);
  font-weight: 500;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============== VIEW MODE BANNER ============== */
.view-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 16px;
  margin-bottom: 16px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  font-size: 12.5px;
}
.view-banner-info {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-1);
  flex: 1;
  min-width: 0;
}
.view-banner-info > div { min-width: 0; }
.view-banner strong { color: var(--accent); }

/* ============== XML SELECT MODAL ============== */
.xml-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  z-index: 9100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.xml-modal-card {
  width: 100%;
  max-width: 720px;
  max-height: calc(100vh - 48px);
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--sh-3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.xml-modal-head {
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  border-bottom: 1px solid var(--border-soft);
}
.xml-modal-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.01em;
}
.xml-modal-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
  line-height: 1.5;
}
.xml-modal-close {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-3);
  width: 28px; height: 28px;
  border-radius: 6px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.xml-modal-close:hover { color: var(--negative); border-color: var(--negative); }

.xml-modal-toolbar {
  padding: 12px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border-soft);
  font-size: 12.5px;
  color: var(--text-2);
}
.xml-modal-toolbar-info strong { color: var(--text-1); }

.xml-modal-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.xml-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid transparent;
  border-radius: 6px;
  margin: 4px 0;
  cursor: pointer;
  transition: all 0.12s;
}
.xml-item:hover {
  background: var(--surface-2);
  border-color: var(--border-soft);
}
.xml-item.selected {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.xml-item.is-st {
  border-left: 3px solid var(--negative);
}
.xml-item-check input { cursor: pointer; }
.xml-item-body { flex: 1; min-width: 0; }
.xml-item-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.xml-item-meta {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 3px;
  font-family: var(--font-mono);
}
.xml-item-value {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
}
.st-pill {
  background: rgba(248, 113, 113, 0.15);
  color: var(--negative);
  border: 1px solid var(--negative);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
}

.xml-modal-summary {
  padding: 14px 22px;
  background: var(--surface-2);
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.xml-summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--text-2);
}
.xml-summary-row strong {
  color: var(--text-1);
  font-family: var(--font-mono);
}
.xml-summary-warn {
  margin-top: 6px;
  padding: 8px 10px;
  background: rgba(248, 113, 113, 0.08);
  color: var(--negative);
  border-left: 2px solid var(--negative);
  border-radius: 4px;
  font-size: 12px;
}

.xml-modal-foot {
  padding: 14px 22px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--border-soft);
  background: var(--surface-1);
}

.integrated{grid-template-columns:var(--sidebar-w) 1fr}.integrated .sidebar button.nav-item{width:100%;text-align:left;background:transparent;border:0;font:inherit;cursor:pointer}.integrated .sidebar button.active{background:var(--accent-soft);color:var(--accent)}.module-note{color:var(--text-2);font-size:13px;line-height:1.6;margin:14px 0}.sidebar .module-note{padding:16px}.production-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}.production-row input{width:auto;display:inline-block;accent-color:var(--accent)}.module-tabs{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}details.card summary{padding:18px;cursor:pointer}input[readonly]{opacity:.7;background:var(--bg)}.integrated .field{margin-bottom:16px}.integrated .sidebar{overflow:auto}.integrated .nav-item{white-space:normal}.integrated .insumos{overflow:auto;min-width:0}.integrated .insumo,.integrated .insumos-head,.integrated .insumo-subtotal{min-width:850px}@media(max-width:880px){.integrated{display:block}.integrated .sidebar{position:static;width:auto;max-height:none;height:auto}.integrated .main{padding:16px}.integrated .topbar{position:static}.integrated .main-wrap{min-width:0}} .margin-summary strong{display:block;font-size:22px;margin-top:10px}.margin-summary span{font-size:12px;color:var(--text-2)}</style></head><body><div id="root"></div><script>/**

(()=>{// =====================================================================
// Cálculos fiscais — Lucro Real
// Mantém fielmente a lógica do app original (regras tributárias preservadas)
// =====================================================================

window.brl = (v, d=2) => 'R$ ' + (parseFloat(v)||0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
window.pct = (v) => ((parseFloat(v)||0)*100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
window.intFmt = (v) => Math.round(parseFloat(v)||0).toLocaleString('pt-BR');

window.calcProduto = (produto, params) => {
  if (!produto) return null;
  const N = (x) => { const n = parseFloat(x); return isNaN(n) ? 0 : n; }; // coerção segura
  const sourceNF = produto.nf;
  const manualMP = sourceNF.xmlInfo?.costSource === 'manual';
  const nf = manualMP ? {...sourceNF,icms:0,ipi:0,frete:0,seguro:0,outras:0,desconto:0,xmlInfo:{...sourceNF.xmlInfo,catalogFiscal:{pcEligible:false,icmsEligible:false,ipiRecoverable:false}}} : sourceNF;
  const credits=window.mpFiscal(nf);
  const aliqIcmsNF = N(nf.icms) / 100;
  const aliqIpiNF = N(nf.ipi) / 100;
  const aliqPIS = N(params.pis) / 100;
  const aliqCOFINS = N(params.cofins) / 100;

  const frete = N(nf.frete);
  const seguro = N(nf.seguro);
  const outras = N(nf.outras);
  const desconto = N(nf.desconto);
  const despesasAcessorias = frete + seguro + outras - desconto;

  const nfValor = N(nf.valor);
  const nfKg = N(nf.kg);
  const valorProd = (nfValor - despesasAcessorias) / (1 + aliqIpiNF);
  const valorIPI = (nfValor - despesasAcessorias) - valorProd;
  const icmsDestac = valorProd * aliqIcmsNF;
  const basePC = Math.max(0, nf.simples==='SIM'&&credits.pcBase!=null ? N(credits.pcBase) : (valorProd - icmsDestac) + despesasAcessorias);
  const credPIS = credits.pcEligible === true ? basePC * aliqPIS : 0;
  const credCOFINS = credits.pcEligible === true ? basePC * aliqCOFINS : 0;
  const credICMS = credits.icmsEligible === true ? icmsDestac : 0;
  const credIPI = credits.ipiRecoverable === true ? valorIPI : 0;
  const credTotal = credICMS + credIPI + credPIS + credCOFINS;
  const custoLiq = nfValor - credTotal;
  const custoKg = nfKg > 0 ? custoLiq / nfKg : 0;

  const subtotal = produto.insumos.reduce((s, i) => s + N(i.valor), 0);
  let credPISDiretos = 0, credCOFINSDiretos = 0, credICMSDiretos = 0;
  for (const ins of produto.insumos) {
    const valor = N(ins.valor);
    const aliqI = N(ins.aliqICMS) / 100;
    if (ins.credPC) {
      const baseSemICMS = valor * (1 - aliqI);
      credPISDiretos += baseSemICMS * aliqPIS;
      credCOFINSDiretos += baseSemICMS * aliqCOFINS;
    }
    if (ins.credICMS) credICMSDiretos += valor * aliqI;
  }
  const credTotalDiretos = credPISDiretos + credCOFINSDiretos + credICMSDiretos;

  const mpDia = N(produto.prod.mpKg) * custoKg;
  const custoTotalDia = mpDia + subtotal - credTotalDiretos;
  const cmvUn = N(produto.prod.qtd) > 0 ? custoTotalDia / N(produto.prod.qtd) : 0;

  return {
    nf: { valorProd, valorIPI, icmsDestac, basePC, credPIS, credCOFINS,
          credTotal, credICMS, credIPI, custoLiq, custoKg, despesasAcessorias,
          frete, seguro, outras, desconto },
    insumos: { subtotal, credPISDiretos, credCOFINSDiretos, credICMSDiretos, credTotalDiretos },
    cmv: { mpDia, custoTotalDia, cmvUn },
  };
};

window.calcVenda = (venda, produto, params) => {
  const N = (x) => { const n = parseFloat(x); return isNaN(n) ? 0 : n; };
  const prodCalc = window.calcProduto(produto, params);
  const cmvUn = prodCalc ? prodCalc.cmv.cmvUn : 0;

  const aliqPIS = N(params.pis) / 100;
  const aliqCOFINS = N(params.cofins) / 100;
  const aliqIRPJ = N(params.irpj) / 100;
  const aliqCSLL = N(params.csll) / 100;
  const aliqFixos = N(params.fixos) / 100;
  const aplicarFixos = params.aplicarFixos !== false; // default true para compatibilidade

  const uf = window.UFS.find(u => u[0] === venda.uf) || window.UFS[25];
  const isIntra = venda.uf === 'SP';
  const tipo = isIntra ? 'Interna' : 'Interestadual';
  const fiscal = venda.fiscal || {};
  const aliqICMS = fiscal.icms != null ? N(fiscal.icms)/100 : isIntra ? N(params.icmsSp) / 100 : uf[1];
  const aliqInterna = fiscal.internal != null ? N(fiscal.internal)/100 : uf[2];
  const isNaoContrib = venda.contrib === 'NAO';
  const difalAplicavel = !isIntra && isNaoContrib;
  const aliqIPI = venda.ipi === 'SIM' ? N(params.ipi) / 100 : 0;

  const valorNota = N(venda.valor);
  const qtd = N(venda.qtd);
  const comissaoPct = N(venda.comissao);
  const ipi = aliqIPI > 0 ? valorNota - valorNota / (1 + aliqIPI) : 0;
  const receitaBruta = valorNota - ipi;
  const baseICMS = isNaoContrib || fiscal.purpose==='final' ? valorNota : receitaBruta;
  const icmsDeb = baseICMS * aliqICMS;
  const baseDifal = baseICMS;
  const difal = difalAplicavel ? baseDifal * Math.max(0,aliqInterna-aliqICMS) : 0;
  const fcp = Math.max(0,N(fiscal.fcp));
  const basePisCofins = fiscal.useBasePc ? Math.max(0,N(fiscal.basePc)) : Math.max(0,receitaBruta-icmsDeb-difal);
  const pisV = basePisCofins * aliqPIS;
  const cofinsV = basePisCofins * aliqCOFINS;

  const receitaLiq = receitaBruta - icmsDeb - pisV - cofinsV - difal - fcp;
  const cmvTotal = qtd * cmvUn;
  const lucroBruto = receitaLiq - cmvTotal;
  const comissao = venda.mkt === 'SIM' ? receitaBruta * (comissaoPct / 100) : 0;
  const custosFixos = aplicarFixos ? receitaBruta * aliqFixos : 0;
  const lucroAntesIR = lucroBruto - comissao - custosFixos;
  const irpj = Math.max(lucroAntesIR, 0) * aliqIRPJ;
  const csll = Math.max(lucroAntesIR, 0) * aliqCSLL;
  const lucroLiq = lucroAntesIR - irpj - csll;

  const tributos = icmsDeb + pisV + cofinsV + difal + fcp + irpj + csll;
  const margemBruta = receitaBruta > 0 ? lucroBruto / receitaBruta : 0;
  const margemLiq = receitaBruta > 0 ? lucroLiq / receitaBruta : 0;
  const cargaTrib = receitaBruta > 0 ? tributos / receitaBruta : 0;
  const markup = cmvTotal > 0 ? (receitaBruta - cmvTotal) / cmvTotal : 0;
  const precoUn = qtd > 0 ? valorNota / qtd : 0;

  return {
    cmvUn, tipo, aliqICMS, aliqInterna, difalAplicavel, aliqIPI, precoUn,
    baseICMS, basePisCofins, baseDifal, isNaoContrib,
    aplicarFixos,
    dre: { valorNota, ipi, receitaBruta, icmsDeb, pis: pisV, cofins: cofinsV, difal, fcp,
           receitaLiq, cmvTotal, lucroBruto, comissao, custosFixos,
           lucroAntesIR, irpj, csll, lucroLiq },
    kpi: { tributos, margemBruta, margemLiq, cargaTrib, markup },
  };
};

(()=>{// =====================================================================
// PARSER DE XML DA NF-E
// Funções puras — não tocam no DOM nem no state da UI.
// Exportadas em window: parseXmlNFe, agruparItensXml, calcularSelecaoXml
// =====================================================================

// Helper: verificar se é descendente direto até profundidade N
function isDirectChild(parent, el, maxDepth) {
  let cur = el.parentNode;
  let depth = 0;
  while (cur && depth < maxDepth) {
    if (cur === parent) return true;
    cur = cur.parentNode;
    depth++;
  }
  return false;
}

window.parseXmlNFe = function parseXmlNFe(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'application/xml');

  const parserError = doc.querySelector('parsererror');
  if (parserError) {
    return { ok: false, erro: 'XML inválido. Verifique se colou o conteúdo correto.' };
  }

  const findAll = (tag) => Array.from(doc.getElementsByTagNameNS('*', tag));
  const find = (tag) => findAll(tag)[0];
  const txt = (tag) => find(tag)?.textContent?.trim() || '';
  const num = (tag) => {
    const v = txt(tag);
    return v ? parseFloat(v.replace(',', '.')) : 0;
  };

  const infNFe = find('infNFe');
  if (!infNFe) {
    return { ok: false, erro: 'XML não parece ser uma NF-e (tag infNFe não encontrada).' };
  }

  // Emitente
  const emit = find('emit');
  const emitCNPJ = emit?.getElementsByTagNameNS('*', 'CNPJ')[0]?.textContent || '';
  const emitNome = emit?.getElementsByTagNameNS('*', 'xNome')[0]?.textContent || '';
  const crt = emit?.getElementsByTagNameNS('*', 'CRT')[0]?.textContent || '';
  const isSimples = crt === '1' || crt === '2';

  // Totais da NF
  const icmsTot = find('ICMSTot');
  const numTot = (tag) => {
    if (!icmsTot) return num(tag);
    const el = icmsTot.getElementsByTagNameNS('*', tag)[0];
    if (!el) return 0;
    return parseFloat((el.textContent || '0').replace(',', '.')) || 0;
  };
  const totalNF = {
    vNF: numTot('vNF'),
    vProd: numTot('vProd'),
    vICMS: numTot('vICMS'),
    vIPI: numTot('vIPI'),
    vFrete: numTot('vFrete'),
    vSeg: numTot('vSeg'),
    vOutro: numTot('vOutro'),
    vDesc: numTot('vDesc'),
  };

  // Itens
  const dets = findAll('det');
  const itens = [];

  for (let i = 0; i < dets.length; i++) {
    const det = dets[i];
    const prod = det.getElementsByTagNameNS('*', 'prod')[0];
    const imp = det.getElementsByTagNameNS('*', 'imposto')[0];
    if (!prod) continue;

    const getN = (parent, tag) => {
      const el = parent.getElementsByTagNameNS('*', tag)[0];
      if (!el) return 0;
      if (el.parentNode !== parent && !isDirectChild(parent, el, 3)) {
        const direct = Array.from(parent.children).find(c => c.localName === tag);
        if (!direct) return 0;
        return parseFloat((direct.textContent || '0').replace(',', '.')) || 0;
      }
      return parseFloat((el.textContent || '0').replace(',', '.')) || 0;
    };
    const getT = (parent, tag) => {
      const el = parent.getElementsByTagNameNS('*', tag)[0];
      return el?.textContent?.trim() || '';
    };

    const qCom = getN(prod, 'qCom') || getN(prod, 'qTrib');
    const uCom = getT(prod, 'uCom') || getT(prod, 'uTrib');
    const xProd = getT(prod, 'xProd');
    const ncm = getT(prod, 'NCM');
    const cProd = getT(prod, 'cProd');
    const vProdItem = getN(prod, 'vProd');
    const vFreteItem = getN(prod, 'vFrete');
    const vSegItem = getN(prod, 'vSeg');
    const vOutroItem = getN(prod, 'vOutro');
    const vDescItem = getN(prod, 'vDesc');

    // Alíquotas e detecção de ICMS-ST
    let pICMS = 0, pCredSN = 0, pIPI = 0, vICMSItem = 0, vIPIItem = 0;
    let vICMSST = 0, pICMSST = 0;
    let cstICMS = '';
    let csosnICMS = '';
    let icmsTag = '';
    if (imp) {
      const icmsGroup = imp.getElementsByTagNameNS('*', 'ICMS')[0];
      if (icmsGroup) {
        for (const child of Array.from(icmsGroup.children)) {
          const localName = child.localName || child.nodeName;
          if (localName && localName.startsWith('ICMS')) {
            icmsTag = localName;
            const cstEl = child.getElementsByTagNameNS('*', 'CST')[0];
            if (cstEl) cstICMS = cstEl.textContent.trim();
            const csosnEl = child.getElementsByTagNameNS('*', 'CSOSN')[0];
            if (csosnEl) csosnICMS = csosnEl.textContent.trim();
            break;
          }
        }
      }
      const pICMSel = imp.getElementsByTagNameNS('*', 'pICMS')[0];
      if (pICMSel) pICMS = parseFloat(pICMSel.textContent.replace(',', '.')) || 0;
      const pCredSNel = imp.getElementsByTagNameNS('*', 'pCredSN')[0];
      if (pCredSNel) pCredSN = parseFloat(pCredSNel.textContent.replace(',', '.')) || 0;
      const pIPIel = imp.getElementsByTagNameNS('*', 'pIPI')[0];
      if (pIPIel) pIPI = parseFloat(pIPIel.textContent.replace(',', '.')) || 0;
      const vICMSel = imp.getElementsByTagNameNS('*', 'vICMS')[0];
      if (vICMSel) vICMSItem = parseFloat(vICMSel.textContent.replace(',', '.')) || 0;
      const vIPIel = imp.getElementsByTagNameNS('*', 'vIPI')[0];
      if (vIPIel) vIPIItem = parseFloat(vIPIel.textContent.replace(',', '.')) || 0;
      const vICMSSTel = imp.getElementsByTagNameNS('*', 'vICMSST')[0];
      if (vICMSSTel) vICMSST = parseFloat(vICMSSTel.textContent.replace(',', '.')) || 0;
      const pICMSSTel = imp.getElementsByTagNameNS('*', 'pICMSST')[0];
      if (pICMSSTel) pICMSST = parseFloat(pICMSSTel.textContent.replace(',', '.')) || 0;
    }

    const cstsComST = ['10', '30', '60', '70', '90'];
    const csosnsComST = ['201', '202', '203', '500', '900'];
    const tagsComST = ['ICMS10', 'ICMS30', 'ICMS60', 'ICMS70', 'ICMSST',
                       'ICMSSN201', 'ICMSSN202', 'ICMSSN203', 'ICMSSN500', 'ICMSSN900'];

    const isST = (
      cstsComST.includes(cstICMS) ||
      csosnsComST.includes(csosnICMS) ||
      tagsComST.includes(icmsTag) ||
      vICMSST > 0
    );
    const isSTRetidoAnterior = (cstICMS === '60' || icmsTag === 'ICMS60' || csosnICMS === '500');

    let aliqICMSef = 0;
    if (isST) {
      aliqICMSef = 0;
    } else {
      aliqICMSef = isSimples ? pCredSN : pICMS;
      if (aliqICMSef === 0 && vProdItem > 0 && vICMSItem > 0) {
        aliqICMSef = (vICMSItem / vProdItem) * 100;
      }
    }
    let aliqIPIef = pIPI;
    if (aliqIPIef === 0 && vProdItem > 0 && vIPIItem > 0) {
      aliqIPIef = (vIPIItem / vProdItem) * 100;
    }

    itens.push({
      nItem: i + 1,
      cProd, xProd, ncm, uCom,
      isKg: ['KG', 'KGS', 'KILO'].includes(uCom.toUpperCase()),
      qCom, vProd: vProdItem,
      aliqICMS: aliqICMSef,
      aliqIPI: aliqIPIef,
      vICMS: vICMSItem,
      vIPI: vIPIItem,
      isST, isSTRetidoAnterior,
      cstICMS, csosnICMS, icmsTag,
      vICMSST,
      vFreteItem, vSegItem, vOutroItem, vDescItem,
    });
  }

  if (itens.length === 0) {
    return { ok: false, erro: 'Nenhum item encontrado na NF-e.' };
  }

  return {
    ok: true,
    fornecedor: emitNome,
    cnpj: emitCNPJ,
    isSimples,
    totalNF,
    itens,
  };
};

window.agruparItensXml = function agruparItensXml(itens) {
  const grupos = {};
  for (const it of itens) {
    const key = it.xProd || `item-${it.nItem}`;
    if (!grupos[key]) {
      grupos[key] = {
        chave: key,
        xProd: it.xProd,
        ncms: new Set(),
        cProds: new Set(),
        unidades: new Set(),
        isKg: it.isKg,
        isST: false,
        hasSTItem: false,
        cstsICMS: new Set(),
        nItems: [],
        qCom: 0, vProd: 0, vICMS: 0, vIPI: 0, vICMSST: 0,
        vFreteItem: 0, vSegItem: 0, vOutroItem: 0, vDescItem: 0,
        aliqICMSPond: 0, aliqIPIPond: 0,
        _allItemsST: true,
      };
    }
    const g = grupos[key];
    if (it.ncm) g.ncms.add(it.ncm);
    if (it.cProd) g.cProds.add(it.cProd);
    if (it.uCom) g.unidades.add(it.uCom.toUpperCase());
    if (it.cstICMS) g.cstsICMS.add(it.cstICMS);
    if (it.csosnICMS) g.cstsICMS.add('CSOSN ' + it.csosnICMS);
    g.nItems.push(it.nItem);
    g.qCom += it.qCom;
    g.vProd += it.vProd;
    g.vICMS += it.vICMS;
    g.vIPI += it.vIPI;
    g.vICMSST += (it.vICMSST || 0);
    g.vFreteItem += it.vFreteItem;
    g.vSegItem += it.vSegItem;
    g.vOutroItem += it.vOutroItem;
    g.vDescItem += it.vDescItem;
    g.aliqICMSPond += it.aliqICMS * it.vProd;
    g.aliqIPIPond += it.aliqIPI * it.vProd;
    if (it.isKg) g.isKg = true;
    if (it.isST) g.hasSTItem = true;
    if (!it.isST) g._allItemsST = false;
  }
  return Object.values(grupos).map(g => ({
    ...g,
    ncms: Array.from(g.ncms),
    cProds: Array.from(g.cProds),
    unidades: Array.from(g.unidades),
    cstsICMS: Array.from(g.cstsICMS),
    aliqICMS: g.vProd > 0 ? g.aliqICMSPond / g.vProd : 0,
    aliqIPI: g.vProd > 0 ? g.aliqIPIPond / g.vProd : 0,
    isST: g.hasSTItem && g._allItemsST,
  }));
};

window.calcularSelecaoXml = function calcularSelecaoXml(grupos, parsed) {
  const totalVProdNF = parsed.totalNF.vProd || grupos.reduce((s, g) => s + g.vProd, 0);
  const vProdSelecionado = grupos.reduce((s, g) => s + g.vProd, 0);
  const proporcao = totalVProdNF > 0 ? vProdSelecionado / totalVProdNF : 0;

  const freteItem = grupos.reduce((s, g) => s + g.vFreteItem, 0);
  const segItem = grupos.reduce((s, g) => s + g.vSegItem, 0);
  const outroItem = grupos.reduce((s, g) => s + g.vOutroItem, 0);
  const descItem = grupos.reduce((s, g) => s + g.vDescItem, 0);

  const frete = freteItem > 0 ? freteItem : parsed.totalNF.vFrete * proporcao;
  const seguro = segItem > 0 ? segItem : parsed.totalNF.vSeg * proporcao;
  const outras = outroItem > 0 ? outroItem : parsed.totalNF.vOutro * proporcao;
  const desconto = descItem > 0 ? descItem : parsed.totalNF.vDesc * proporcao;

  const vICMSSel = grupos.reduce((s, g) => s + g.vICMS, 0);
  const vIPISel = grupos.reduce((s, g) => s + g.vIPI, 0);
  const qCom = grupos.reduce((s, g) => s + g.qCom, 0);

  const aliqIcmsPond = grupos.reduce((s, g) => s + g.aliqICMS * g.vProd, 0);
  const aliqIpiPond = grupos.reduce((s, g) => s + g.aliqIPI * g.vProd, 0);
  const aliqICMS = vProdSelecionado > 0 ? aliqIcmsPond / vProdSelecionado : 0;
  const aliqIPI = vProdSelecionado > 0 ? aliqIpiPond / vProdSelecionado : 0;

  const valorNotaEquivalente = vProdSelecionado + vIPISel + frete + seguro + outras - desconto;

  const unidades = [...new Set(grupos.flatMap(g => g.unidades))];
  const ncms = [...new Set(grupos.flatMap(g => g.ncms))];
  const descricoes = grupos.map(g => g.xProd).filter(Boolean).slice(0, 3);
  const isKg = unidades.some(u => ['KG', 'KGS', 'KILO'].includes(u));

  return {
    valor: valorNotaEquivalente,
    qtd: qCom,
    aliqICMS, aliqIPI,
    frete, seguro, outras, desconto,
    isKg,
    unidade: unidades.join(', '),
    ncms, descricoes,
    qtdItens: grupos.reduce((s, g) => s + g.nItems.length, 0),
    proporcaoNF: proporcao,
    hasST: grupos.some(g => g.isST),
    allST: grupos.length > 0 && grupos.every(g => g.isST),
    gruposComST: grupos.filter(g => g.isST).map(g => g.xProd),
  };
};

// Aplica o resultado da seleção ao objeto produto (mutação imutável: retorna produto novo)
window.aplicarXmlAoProduto = function aplicarXmlAoProduto(produto, selecao, parsed) {

  function setSession(s) {
    if (s) localStorage.setItem(AUTH_KEY, JSON.stringify(s));

  function isExpired(session) {
    if (!session || !session.expires_at) return true;
